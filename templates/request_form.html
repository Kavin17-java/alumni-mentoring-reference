{% extends "base.html" %}{% block content %}<h1>Request mentoring from {{ alumnus.name }}</h1><form method="post" class="form-narrow"><label class="form-label">Choose student profile</label><select class="form-select mb-3" name="student_id">{% for item in students %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select><label class="form-label">Message (10 to 300 characters)</label><textarea class="form-control mb-3" name="message" minlength="10" maxlength="300" required></textarea><button class="btn btn-primary">Send request</button></form>{% endblock %}
