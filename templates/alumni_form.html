{% extends "base.html" %}{% block content %}<h1>Register alumni profile</h1><form method="post" class="form-narrow">
<label class="form-label">Name</label><input class="form-control mb-3" name="name" required minlength="2" maxlength="60">
<label class="form-label">Graduation year</label><input class="form-control mb-3" name="graduation_year" type="number" min="1990" max="2026" required>
<label class="form-label">Industry</label><select class="form-select mb-3" name="industry" required>{% for industry in industries %}<option>{{ industry }}</option>{% endfor %}</select>
<label class="form-label">Job role</label><input class="form-control mb-3" name="role" required>
<label class="form-label">Expertise keywords (up to five, comma separated)</label><input class="form-control mb-3" name="expertise" required>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="consent" value="yes" id="consent"><label class="form-check-label" for="consent">I agree to appear in the mentoring directory. Consent date is recorded when selected.</label></div>
<button class="btn btn-primary">Save profile</button></form>{% endblock %}
